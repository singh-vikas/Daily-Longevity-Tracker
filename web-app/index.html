<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Longevity Quest</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sticky game dashboard -->
  <header class="hud" id="hud">
    <div class="hud-row">
      <div class="hud-left">
        <span class="level-badge" id="level-badge">Lv 1</span>
        <div class="xp-wrap">
          <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
          <span class="xp-text" id="xp-text">0 / 200 XP</span>
        </div>
      </div>
      <div class="hud-right">
        <span class="stat streak" id="streak-chip" title="Daily streak">🔥 <b id="streak-days">0</b></span>
        <span class="stat combo" id="combo-chip" title="Streak XP multiplier">×1.0</span>
        <span class="stat ring" id="ring-chip" title="Today's completion"><b id="today-pct">0%</b></span>
        <button id="dark-toggle" class="icon-btn" title="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="title-row">
      <h1>🌱 Longevity Quest</h1>
      <div class="date-picker">
        <input type="date" id="tracker-date">
        <button id="today-btn" class="mini-btn">Today</button>
      </div>
    </div>

    <!-- Today's quests -->
    <section class="quests" id="quests-panel">
      <h2>🎯 Today's Quests <span class="muted" id="quests-sub"></span></h2>
      <div id="quests-list" class="quests-list"></div>
    </section>

    <!-- Vitals -->
    <section class="card vitals-card">
      <div class="card-head">
        <h2>📈 Log Vitals <span class="xp-chip">+15</span></h2>
        <span class="muted small" id="vitals-status"></span>
      </div>
      <div class="vitals-grid">
        <label>Sleep hrs<input type="number" id="m-sleep-duration" step="0.25" min="0" max="14"></label>
        <label>Sleep /10<input type="number" id="m-sleep-quality" min="1" max="10"></label>
        <label>Energy AM<input type="number" id="m-energy-morning" min="1" max="10"></label>
        <label>Energy PM<input type="number" id="m-energy-afternoon" min="1" max="10"></label>
        <label>Energy Eve<input type="number" id="m-energy-evening" min="1" max="10"></label>
        <label>Mood /10<input type="number" id="m-mood" min="1" max="10"></label>
        <label>Stress /10<input type="number" id="m-stress" min="1" max="10"></label>
      </div>
    </section>

    <!-- Routine sections render here -->
    <div id="routine"></div>

    <!-- Stats & badges -->
    <section class="card collapsible" id="stats-card">
      <div class="card-head clickable" data-toggle="stats-body">
        <h2>🏆 Stats &amp; Badges</h2><span class="chevron">▾</span>
      </div>
      <div class="card-body" id="stats-body">
        <div class="stat-grid" id="stat-grid"></div>
        <h3>Badges</h3>
        <div class="badge-grid" id="badge-grid"></div>
        <h3>Last 7 days</h3>
        <div class="spark" id="spark"></div>
      </div>
    </section>

    <!-- History -->
    <section class="card collapsible" id="history-card">
      <div class="card-head clickable" data-toggle="history-body">
        <h2>📅 History</h2><span class="chevron">▾</span>
      </div>
      <div class="card-body hidden" id="history-body">
        <div id="history-list"></div>
      </div>
    </section>

    <div class="data-actions">
      <button id="export-btn" class="mini-btn">⬇ Export</button>
      <label class="mini-btn">⬆ Import<input type="file" id="import-file" accept=".json" hidden></label>
    </div>
    <p class="disclaimer">Personalized to your Apr 2026 labs. 🩺 = confirm dosing with your doctor. General wellness tracking, not medical advice.</p>
  </main>

  <!-- FX layers -->
  <div id="fx-layer" class="fx-layer"></div>
  <div id="levelup" class="levelup hidden"><div class="levelup-inner"><div class="lu-title">LEVEL UP!</div><div class="lu-level" id="lu-level">Lv 2</div></div></div>

  <script src="tracker.js"></script>
</body>
</html>
